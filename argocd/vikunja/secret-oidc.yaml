#
#   kubectl create secret generic vikunja-oidc --namespace documents \
#     --from-literal=VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_CLIENTID='<value>' \
#     --from-literal=VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_CLIENTSECRET='<value>' \
#     --dry-run=client -o yaml | kubeseal --format yaml > argocd/vikunja/secret-oidc.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: vikunja-oidc
  namespace: documents
spec:
  encryptedData:
    VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_CLIENTID: REPLACE_WITH_KUBESEAL_OUTPUT
    VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_CLIENTSECRET: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: vikunja-oidc
      namespace: documents
