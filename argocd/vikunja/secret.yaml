# Example SealedSecret: the values below are placeholders, not ciphertext.
# Recreate it against your own cluster's sealed-secrets controller:
#
#   kubectl create secret generic vikunja-secrets --namespace documents \
#     --from-literal=VIKUNJA_SERVICE_SECRET='<value>' \
#     --dry-run=client -o yaml | kubeseal --format yaml > argocd/vikunja/secret.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: vikunja-secrets
  namespace: documents
spec:
  encryptedData:
    VIKUNJA_SERVICE_SECRET: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: vikunja-secrets
      namespace: documents
