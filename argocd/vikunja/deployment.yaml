apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
  namespace: documents
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vikunja
  template:
    metadata:
      labels:
        app: vikunja
    spec:
      # Everything here uses DNS names, so skip the <SERVICE>_PORT env vars
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: vikunja
          # API + frontend in one image
          image: docker.io/vikunja/vikunja:2.8.0
          envFrom:
            - configMapRef:
                name: vikunja-env
            - secretRef:
                name: vikunja-secrets
            # Optional so Vikunja starts before the Pocket ID client exists
            - secretRef:
                name: vikunja-oidc
                optional: true
          ports:
            - name: http
              containerPort: 3456
          # First start runs DB migrations
          startupProbe:
            httpGet:
              path: /health
              port: 3456
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3456
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/vikunja/config.yml
              subPath: config.yml
            - name: db
              mountPath: /db
            - name: documents-library
              mountPath: /app/vikunja/files
              subPath: vikunja/files
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: vikunja-config
        - name: db
          persistentVolumeClaim:
            claimName: vikunja-db-iscsi
        - name: documents-library
          persistentVolumeClaim:
            claimName: documents-library
