# Example SealedSecret: the values below are placeholders, not ciphertext.
# Recreate it against your own cluster's sealed-secrets controller:
#
#   kubectl create secret generic smtp-relay-credentials --namespace mail \
#     --from-literal=RELAYHOST_PASSWORD='<value>' \
#     --from-literal=RELAYHOST_USERNAME='<value>' \
#     --dry-run=client -o yaml | kubeseal --format yaml > argocd/mail-relay/secret.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: smtp-relay-credentials
  namespace: mail
spec:
  encryptedData:
    RELAYHOST_PASSWORD: REPLACE_WITH_KUBESEAL_OUTPUT
    RELAYHOST_USERNAME: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: smtp-relay-credentials
      namespace: mail
