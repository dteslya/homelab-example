apiVersion: v1
kind: ConfigMap
metadata:
  name: karakeep-env
  namespace: documents
data:
  # SQLite DBs on the karakeep-data iSCSI PVC; assets in the documents dataset
  DATA_DIR: /data
  ASSETS_DIR: /assets
  NEXTAUTH_URL: https://bookmarks.lab.example.com
  MEILI_ADDR: http://karakeep-meilisearch:7700
  BROWSER_WEB_URL: http://karakeep-chrome:9222
  LOG_LEVEL: info
  # DB_WAL_MODE stays off (rollback journal). The DB moved from NFS to iSCSI,
  # so WAL would work now, but nothing needs it yet.
  # Pocket ID login. OAUTH_CLIENT_ID and OAUTH_CLIENT_SECRET come from the
  # karakeep-oidc secret, so nothing points at a client that doesn't exist yet.
  # Anyone allowed through Pocket ID can sign up; the local login form is off.
  # The first account created becomes the Karakeep admin.
  OAUTH_WELLKNOWN_URL: https://id.lab.example.com/.well-known/openid-configuration
  OAUTH_PROVIDER_NAME: Pocket ID
  DISABLE_SIGNUPS: "false"
  DISABLE_PASSWORD_AUTH: "true"
  OAUTH_AUTO_REDIRECT: "true"
  # Crawler: screenshots only. Full-page archives and PDFs can use a lot of
  # disk, turn them on later if needed.
  CRAWLER_STORE_SCREENSHOT: "true"
  CRAWLER_FULL_PAGE_ARCHIVE: "false"
  # AI tagging is off until an inference provider is configured
  INFERENCE_ENABLE_AUTO_TAGGING: "false"
  # Outgoing mail via the lab relay
  SMTP_HOST: smtp-relay.mail.svc.cluster.local
  SMTP_PORT: "25"
  SMTP_FROM: karakeep@lab.example.com
