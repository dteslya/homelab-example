# Example SealedSecret: the values below are placeholders, not ciphertext.
# Recreate it against your own cluster's sealed-secrets controller:
#
#   kubectl create secret generic karakeep-oidc --namespace documents \
#     --from-literal=OAUTH_CLIENT_ID='<value>' \
#     --from-literal=OAUTH_CLIENT_SECRET='<value>' \
#     --dry-run=client -o yaml | kubeseal --format yaml > argocd/karakeep/secret-oidc.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: karakeep-oidc
  namespace: documents
spec:
  encryptedData:
    OAUTH_CLIENT_ID: REPLACE_WITH_KUBESEAL_OUTPUT
    OAUTH_CLIENT_SECRET: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: karakeep-oidc
      namespace: documents
