apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep-meilisearch
  namespace: documents
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: karakeep-meilisearch
  template:
    metadata:
      labels:
        app: karakeep-meilisearch
    spec:
      containers:
        - name: meilisearch
          # Version pinned by Karakeep's docker-compose.yml. A newer index
          # format needs a dump/import, so only bump it together with Karakeep.
          image: docker.io/getmeili/meilisearch:v1.41.0
          env:
            - name: MEILI_NO_ANALYTICS
              value: "true"
            - name: MEILI_ENV
              value: production
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: karakeep-secrets
                  key: MEILI_MASTER_KEY
          ports:
            - name: http
              containerPort: 7700
          readinessProbe:
            httpGet:
              path: /health
              port: 7700
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /meili_data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: karakeep-meilisearch-iscsi
