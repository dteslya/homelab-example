# Example SealedSecret: the values below are placeholders, not ciphertext.
# Recreate it against your own cluster's sealed-secrets controller:
#
#   kubectl create secret generic karakeep-secrets --namespace documents \
#     --from-literal=MEILI_MASTER_KEY='<value>' \
#     --from-literal=NEXTAUTH_SECRET='<value>' \
#     --dry-run=client -o yaml | kubeseal --format yaml > argocd/karakeep/secret.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: karakeep-secrets
  namespace: documents
spec:
  encryptedData:
    MEILI_MASTER_KEY: REPLACE_WITH_KUBESEAL_OUTPUT
    NEXTAUTH_SECRET: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: karakeep-secrets
      namespace: documents
