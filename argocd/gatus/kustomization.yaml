apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - secret.yaml
# Generated with a content-hash name suffix, so any config change rolls the Deployment
configMapGenerator:
  - name: gatus-config
    namespace: monitoring
    files:
      - config/config.yaml
