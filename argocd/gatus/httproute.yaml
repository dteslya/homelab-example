# No SecurityPolicy: Gatus does its own Pocket ID login, and TrueNAS pushes
# heartbeats to /api/v1/endpoints/*/external with a bearer token.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gatus
  namespace: monitoring
spec:
  parentRefs:
    - name: lab-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "status.lab.example.com"
  rules:
    - backendRefs:
        - name: gatus
          port: 8080
