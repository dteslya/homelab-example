apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      labels:
        app: gatus
    spec:
      containers:
        - name: gatus
          image: ghcr.io/twin/gatus:v5.38.0
          env:
            - name: GATUS_CONFIG_PATH
              value: /config/config.yaml
            - name: TZ
              value: "Etc/UTC"
          # OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, ALERT_EMAIL, HEARTBEAT_TOKEN,
          # substituted into config.yaml at startup
          envFrom:
            - secretRef:
                name: gatus-secrets
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: gatus-config
        - name: data
          persistentVolumeClaim:
            claimName: gatus-data
