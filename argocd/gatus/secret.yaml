# Example SealedSecret: the values below are placeholders, not ciphertext.
# Recreate it against your own cluster's sealed-secrets controller:
#
#   kubectl create secret generic gatus-secrets --namespace monitoring \
#     --from-literal=ALERT_EMAIL='<value>' \
#     --from-literal=HEARTBEAT_TOKEN='<value>' \
#     --from-literal=OIDC_CLIENT_ID='<value>' \
#     --from-literal=OIDC_CLIENT_SECRET='<value>' \
#     --dry-run=client -o yaml | kubeseal --format yaml > argocd/gatus/secret.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: gatus-secrets
  namespace: monitoring
spec:
  encryptedData:
    ALERT_EMAIL: REPLACE_WITH_KUBESEAL_OUTPUT
    HEARTBEAT_TOKEN: REPLACE_WITH_KUBESEAL_OUTPUT
    OIDC_CLIENT_ID: REPLACE_WITH_KUBESEAL_OUTPUT
    OIDC_CLIENT_SECRET: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: gatus-secrets
      namespace: monitoring
