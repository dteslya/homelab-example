apiVersion: batch/v1
kind: Job
metadata:
  name: media-folder-init
  namespace: media
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: init-folders
          image: busybox@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command:
            - sh
            - -c
            - |
              mkdir -p /data/torrents/movies /data/torrents/tv /data/torrents/books \
                       /data/usenet/incomplete /data/usenet/complete /data/usenet/complete/books \
                       /data/soulseek/incomplete /data/soulseek/complete \
                       /data/media/movies /data/media/tv /data/media/music \
                       /data/youtube
              chown -R 1000:1000 /data
              chmod -R g+w /data
              # One folder per app backup CronJob (they run as 1000)
              for app in sonarr radarr prowlarr bazarr sabnzbd qbittorrent seerr jellyfin beets slskd; do
                mkdir -p /backups/$app
              done
              chown -R 1000:1000 /backups
              chmod 700 /backups/*
          volumeMounts:
            - name: media-library
              mountPath: /data
            - name: backups
              mountPath: /backups
      volumes:
        - name: media-library
          persistentVolumeClaim:
            claimName: media-library
        - name: backups
          persistentVolumeClaim:
            claimName: backups
