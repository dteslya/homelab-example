apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: metube
  namespace: media
spec:
  parentRefs:
    - name: lab-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "metube.lab.example.com"
  rules:
    - backendRefs:
        - name: metube
          port: 8081
