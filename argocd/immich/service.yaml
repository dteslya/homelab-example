apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: photos
spec:
  selector:
    app: immich-server
  ports:
    - name: http
      port: 2283
      targetPort: 2283
---
# Name matches Immich's default ML URL (http://immich-machine-learning:3003)
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: photos
spec:
  selector:
    app: immich-machine-learning
  ports:
    - name: http
      port: 3003
      targetPort: 3003
---
apiVersion: v1
kind: Service
metadata:
  name: immich-valkey
  namespace: photos
spec:
  selector:
    app: immich-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: photos
spec:
  selector:
    app: immich-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
