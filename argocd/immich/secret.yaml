# Example SealedSecret: the values below are placeholders, not ciphertext.
# Recreate it against your own cluster's sealed-secrets controller:
#
#   kubectl create secret generic immich-secrets --namespace photos \
#     --from-literal=DB_PASSWORD='<value>' \
#     --dry-run=client -o yaml | kubeseal --format yaml > argocd/immich/secret.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: immich-secrets
  namespace: photos
spec:
  encryptedData:
    DB_PASSWORD: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: immich-secrets
      namespace: photos
