# Block storage (ext4 on iSCSI), so SQLite locking works and the pod isn't
# pinned to one node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slskd-app-iscsi
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-config
  resources:
    requests:
      storage: 1Gi
