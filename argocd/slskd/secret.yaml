# Example SealedSecret: the values below are placeholders, not ciphertext.
# Recreate it against your own cluster's sealed-secrets controller:
#
#   kubectl create secret generic slskd-secrets --namespace media \
#     --from-literal=SLSKD_API_KEY='<value>' \
#     --from-literal=SLSKD_SLSK_PASSWORD='<value>' \
#     --from-literal=SLSKD_SLSK_USERNAME='<value>' \
#     --dry-run=client -o yaml | kubeseal --format yaml > argocd/slskd/secret.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: slskd-secrets
  namespace: media
spec:
  encryptedData:
    SLSKD_API_KEY: REPLACE_WITH_KUBESEAL_OUTPUT
    SLSKD_SLSK_PASSWORD: REPLACE_WITH_KUBESEAL_OUTPUT
    SLSKD_SLSK_USERNAME: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: slskd-secrets
      namespace: media
