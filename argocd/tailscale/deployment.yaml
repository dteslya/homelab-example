apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-subnet-router
  namespace: tailscale
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tailscale-subnet-router
  template:
    metadata:
      labels:
        app: tailscale-subnet-router
    spec:
      securityContext:
        sysctls:
          - name: net.ipv4.ip_forward
            value: "1"
          - name: net.ipv6.conf.all.forwarding
            value: "1"
      containers:
        - name: tailscale
          image: tailscale/tailscale:v1.104.7
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: TS_AUTHKEY
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_ROUTES
              value: "10.0.4.192/27,10.0.4.10/32,10.0.14.10/32,10.0.15.0/24"
            - name: TS_USERSPACE
              value: "false"
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_STATE_DIR
              value: "/var/lib/tailscale"
            - name: TS_EXTRA_ARGS
              value: "--login-server=https://vpn.example.com --hostname=k8s-subnet-router"
            - name: TS_DEBUG_FIREWALL_MODE
              value: "nftables"
          volumeMounts:
            - name: state
              mountPath: /var/lib/tailscale
            - name: dev-tun
              mountPath: /dev/net/tun
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: tailscale-state
        - name: dev-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
