# Example SealedSecret: the values below are placeholders, not ciphertext.
# Recreate it against your own cluster's sealed-secrets controller:
#
#   kubectl create secret generic pocket-id-secrets --namespace pocket-id \
#     --from-literal=ENCRYPTION_KEY='<value>' \
#     --dry-run=client -o yaml | kubeseal --format yaml > argocd/pocket-id/secret.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: pocket-id-secrets
  namespace: pocket-id
spec:
  encryptedData:
    ENCRYPTION_KEY: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: pocket-id-secrets
      namespace: pocket-id
