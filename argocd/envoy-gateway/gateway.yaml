apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab-gateway
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    annotations:
      metallb.io/loadBalancerIPs: "10.0.4.200"
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.lab.example.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: lab-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.lab.example.com"
      allowedRoutes:
        namespaces:
          from: All
