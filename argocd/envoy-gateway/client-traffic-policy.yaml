apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: lab-gateway-client
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lab-gateway
  timeout:
    http:
      streamIdleTimeout: 1h
  connection:
    bufferLimit: 1Mi
