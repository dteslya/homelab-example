apiVersion: batch/v1
kind: Job
metadata:
  name: photos-folder-init
  namespace: photos
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: init-folders
          image: busybox@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command:
            - sh
            - -c
            - |
              mkdir -p /data/icloud/bob /data/icloud/alice /data/immich
              chown 1000:1000 /data/icloud /data/icloud/bob /data/icloud/alice
          volumeMounts:
            - name: photos-library
              mountPath: /data
      volumes:
        - name: photos-library
          persistentVolumeClaim:
            claimName: photos-library
