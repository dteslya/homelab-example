apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  namespace: media
spec:
  parentRefs:
    - name: lab-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "sonarr.lab.example.com"
  rules:
    - backendRefs:
        - name: sonarr
          port: 8989
---
# /api bypasses the Pocket ID SecurityPolicy (argocd/media-sso) so mobile
# clients keep working; the app still requires its API key on these paths.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr-api
  namespace: media
spec:
  parentRefs:
    - name: lab-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "sonarr.lab.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: sonarr
          port: 8989
