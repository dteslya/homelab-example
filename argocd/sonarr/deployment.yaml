apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: sonarr
          # https://www.linuxserver.io/our-images
          image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls329
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Etc/UTC"
            # Login is handled by Pocket ID at the gateway (argocd/media-sso);
            # the API key is still enforced on /api.
            - name: SONARR__AUTH__METHOD
              value: External
          ports:
            - name: webui
              containerPort: 8989
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media-library
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config-iscsi
        - name: media-library
          persistentVolumeClaim:
            claimName: media-library
