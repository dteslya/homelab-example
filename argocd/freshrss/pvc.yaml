# Block storage (ext4 on iSCSI), so SQLite locking works normally. Holds the
# whole data dir: config.php and each user's db.sqlite under users/<name>/.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freshrss-data-iscsi
  namespace: documents
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-config
  resources:
    requests:
      storage: 1Gi
