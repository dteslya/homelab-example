# Example SealedSecret: the values below are placeholders, not ciphertext.
# Recreate it against your own cluster's sealed-secrets controller:
#
#   kubectl create secret generic freshrss-oidc --namespace documents \
#     --from-literal=OIDC_CLIENT_CRYPTO_KEY='<value>' \
#     --from-literal=OIDC_CLIENT_ID='<value>' \
#     --from-literal=OIDC_CLIENT_SECRET='<value>' \
#     --dry-run=client -o yaml | kubeseal --format yaml > argocd/freshrss/secret-oidc.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: freshrss-oidc
  namespace: documents
spec:
  encryptedData:
    OIDC_CLIENT_CRYPTO_KEY: REPLACE_WITH_KUBESEAL_OUTPUT
    OIDC_CLIENT_ID: REPLACE_WITH_KUBESEAL_OUTPUT
    OIDC_CLIENT_SECRET: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: freshrss-oidc
      namespace: documents
