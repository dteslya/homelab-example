apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-nfs-config
provisioner: csi.truenas.io
parameters:
  protocol: nfs
  pool: "wd_green_pool"
  compression: LZ4
  nfs.rootSquash: "false"
  nfs.mountOptions: "hard,nfsvers=4.1,noatime,nolock,actimeo=0"
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
