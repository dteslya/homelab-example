# Block storage for app config volumes holding SQLite DBs: a local ext4
# filesystem, so WAL and file locking work, unlike on NFS.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-iscsi-config
provisioner: csi.truenas.io
parameters:
  protocol: iscsi
  pool: "wd_green_pool"
  datasetPath: "k8s/iscsi"
  compression: LZ4
  volblocksize: "16K"
  iscsi.blocksize: "4096"
  csi.storage.k8s.io/fstype: ext4
reclaimPolicy: Delete
allowVolumeExpansion: true
# The volume attaches to a single node, so bind it where the pod lands
volumeBindingMode: WaitForFirstConsumer
