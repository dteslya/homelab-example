apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr
  namespace: media
spec:
  parentRefs:
    - name: lab-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "prowlarr.lab.example.com"
  rules:
    - backendRefs:
        - name: prowlarr
          port: 9696
---
# /api bypasses the Pocket ID SecurityPolicy (argocd/media-sso) so mobile
# clients keep working; the app still requires its API key on these paths.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr-api
  namespace: media
spec:
  parentRefs:
    - name: lab-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "prowlarr.lab.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: prowlarr
          port: 9696
