apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bentopdf
  namespace: media
spec:
  parentRefs:
    - name: lab-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "pdf.lab.example.com"
  rules:
    - backendRefs:
        - name: bentopdf
          port: 8080
