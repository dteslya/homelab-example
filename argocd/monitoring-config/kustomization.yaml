apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - httproute.yaml
  - grafana-admin-secret.yaml
  - grafana-oidc-secret.yaml
  - b2-readonly-secret.yaml
  - cronjob-b2-size.yaml

# Grafana's OpenWrt dashboard (gnetId 11147 rev 1, patched: ${DS_PROMETHEUS} -> victoriametrics,
# wlan0/wlan0-1/wlan1 quality panels -> per-radio, since OpenWrt 23.05+ names them phyN-apM).
# Mounted by argocd/apps/grafana.yaml via extraConfigmapMounts.
configMapGenerator:
  - name: grafana-dashboard-openwrt
    files:
      - openwrt.json=dashboards/openwrt.json
    options:
      disableNameSuffixHash: true
      annotations:
        # ~200 KB: too big for client-side apply's last-applied-configuration annotation
        argocd.argoproj.io/sync-options: ServerSideApply=true
