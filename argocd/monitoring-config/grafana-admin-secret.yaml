#
#   kubectl create secret generic grafana-admin-credentials --namespace monitoring \
#     --from-literal=admin-password='<value>' \
#     --from-literal=admin-user='<value>' \
#     --dry-run=client -o yaml | kubeseal --format yaml > argocd/monitoring-config/grafana-admin-secret.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  encryptedData:
    admin-password: REPLACE_WITH_KUBESEAL_OUTPUT
    admin-user: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: grafana-admin-credentials
      namespace: monitoring
