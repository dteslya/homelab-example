apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookorbit-postgres
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bookorbit-postgres
  template:
    metadata:
      labels:
        app: bookorbit-postgres
    spec:
      containers:
        - name: postgres
          # Same image as BookOrbit's upstream docker-compose.yml
          image: pgvector/pgvector:pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
          env:
            - name: POSTGRES_USER
              value: bookorbit
            - name: POSTGRES_DB
              value: bookorbit
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookorbit-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bookorbit", "-d", "bookorbit"]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bookorbit-postgres-iscsi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
