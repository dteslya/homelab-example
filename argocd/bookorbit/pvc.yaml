# Block storage (ext4 on iSCSI): Postgres gets a local filesystem with
# working fsync and locks. Sized for up to 1GB of WAL on top of the data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookorbit-postgres-iscsi
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-config
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookorbit-data
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-nfs-config
  resources:
    requests:
      storage: 2Gi
