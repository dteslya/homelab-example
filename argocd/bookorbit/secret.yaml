# Example SealedSecret: the values below are placeholders, not ciphertext.
# Recreate it against your own cluster's sealed-secrets controller:
#
#   kubectl create secret generic bookorbit-secrets --namespace media \
#     --from-literal=BOOK_REQUEST_ENCRYPTION_KEY='<value>' \
#     --from-literal=JWT_SECRET='<value>' \
#     --from-literal=POSTGRES_PASSWORD='<value>' \
#     --from-literal=SETUP_BOOTSTRAP_TOKEN='<value>' \
#     --dry-run=client -o yaml | kubeseal --format yaml > argocd/bookorbit/secret.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: bookorbit-secrets
  namespace: media
spec:
  encryptedData:
    BOOK_REQUEST_ENCRYPTION_KEY: REPLACE_WITH_KUBESEAL_OUTPUT
    JWT_SECRET: REPLACE_WITH_KUBESEAL_OUTPUT
    POSTGRES_PASSWORD: REPLACE_WITH_KUBESEAL_OUTPUT
    SETUP_BOOTSTRAP_TOKEN: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: bookorbit-secrets
      namespace: media
