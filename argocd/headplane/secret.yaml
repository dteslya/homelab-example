# Example SealedSecret: the values below are placeholders, not ciphertext.
# Recreate it against your own cluster's sealed-secrets controller:
#
#   kubectl create secret generic headplane-secrets --namespace headplane \
#     --from-literal=COOKIE_SECRET='<value>' \
#     --from-literal=HEADSCALE_API_KEY='<value>' \
#     --from-literal=OIDC_CLIENT_SECRET='<value>' \
#     --dry-run=client -o yaml | kubeseal --format yaml > argocd/headplane/secret.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: headplane-secrets
  namespace: headplane
spec:
  encryptedData:
    COOKIE_SECRET: REPLACE_WITH_KUBESEAL_OUTPUT
    HEADSCALE_API_KEY: REPLACE_WITH_KUBESEAL_OUTPUT
    OIDC_CLIENT_SECRET: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: headplane-secrets
      namespace: headplane
