apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secret.yaml  # uncomment once sealed, see README "Headplane"
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
# Generated with a content-hash name suffix, so any config change rolls the Deployment
configMapGenerator:
  - name: headplane-config
    namespace: headplane
    files:
      - config/config.yaml
