# Example SealedSecret: the values below are placeholders, not ciphertext.
# Recreate it against your own cluster's sealed-secrets controller:
#
#   kubectl create secret generic filebrowser-oidc --namespace media \
#     --from-literal=FILEBROWSER_OIDC_CLIENT_SECRET='<value>' \
#     --dry-run=client -o yaml | kubeseal --format yaml > argocd/filebrowser/secret-oidc.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: filebrowser-oidc
  namespace: media
spec:
  encryptedData:
    FILEBROWSER_OIDC_CLIENT_SECRET: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: filebrowser-oidc
      namespace: media
