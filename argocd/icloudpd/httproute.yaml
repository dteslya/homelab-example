apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: icloudpd-bob
  namespace: photos
spec:
  parentRefs:
    - name: lab-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "icloudpd-bob.lab.example.com"
  rules:
    - backendRefs:
        - name: icloudpd-bob
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: icloudpd-alice
  namespace: photos
spec:
  parentRefs:
    - name: lab-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "icloudpd-alice.lab.example.com"
  rules:
    - backendRefs:
        - name: icloudpd-alice
          port: 8080
