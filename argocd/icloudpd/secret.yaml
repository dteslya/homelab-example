# Example SealedSecret: the values below are placeholders, not ciphertext.
# Recreate it against your own cluster's sealed-secrets controller:
#
#   kubectl create secret generic icloudpd-secrets --namespace photos \
#     --from-literal=alice-username='<value>' \
#     --from-literal=bob-username='<value>' \
#     --dry-run=client -o yaml | kubeseal --format yaml > argocd/icloudpd/secret.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: icloudpd-secrets
  namespace: photos
spec:
  encryptedData:
    alice-username: REPLACE_WITH_KUBESEAL_OUTPUT
    bob-username: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: icloudpd-secrets
      namespace: photos
