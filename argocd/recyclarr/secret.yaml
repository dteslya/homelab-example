# Example SealedSecret: the values below are placeholders, not ciphertext.
# Recreate it against your own cluster's sealed-secrets controller:
#
#   kubectl create secret generic recyclarr-secrets --namespace media \
#     --from-literal=RADARR_API_KEY='<value>' \
#     --from-literal=RADARR_URL='<value>' \
#     --from-literal=SONARR_API_KEY='<value>' \
#     --from-literal=SONARR_URL='<value>' \
#     --dry-run=client -o yaml | kubeseal --format yaml > argocd/recyclarr/secret.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: recyclarr-secrets
  namespace: media
spec:
  encryptedData:
    RADARR_API_KEY: REPLACE_WITH_KUBESEAL_OUTPUT
    RADARR_URL: REPLACE_WITH_KUBESEAL_OUTPUT
    SONARR_API_KEY: REPLACE_WITH_KUBESEAL_OUTPUT
    SONARR_URL: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: recyclarr-secrets
      namespace: media
