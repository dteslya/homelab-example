# Block storage (ext4 on iSCSI), so SQLite WAL and locking work normally.
# Jellyfin refuses to start with less than 2GiB free in /config/data, so
# leave that much on top of the ~600M in use.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-iscsi
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-config
  resources:
    requests:
      storage: 4Gi
