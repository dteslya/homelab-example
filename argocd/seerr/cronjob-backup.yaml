# Nightly copy of Seerr's DB and settings.json (seerr.tar.gz).
# Writes the backups dataset (see README), always under the same filename:
# the B2 bucket keeps prior versions. Runs before the TrueNAS Cloud Sync push
# at 03:00.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: seerr-backup
  namespace: media
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Gives up if Seerr isn't running, so the pod can't sit Pending forever
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          # Same node as Seerr: the config PVC is an RWO iSCSI volume, which
          # attaches to one node at a time
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: seerr
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: backup
              image: keinos/sqlite3:3.54.1
              command:
                - sh
                - -c
                - |
                  set -e
                  mkdir -p /tmp/out
                  mkdir -p /tmp/out/db
                  # .backup takes a consistent copy of the live WAL-mode DB
                  sqlite3 /app/config/db/db.sqlite3 ".backup /tmp/out/db/db.sqlite3"
                  cp /app/config/settings.json /tmp/out/
                  tar czf /backups/seerr.tar.gz.tmp -C /tmp/out .
                  mv /backups/seerr.tar.gz.tmp /backups/seerr.tar.gz
              volumeMounts:
                - name: config
                  mountPath: /app/config
                - name: backups
                  mountPath: /backups
                  subPath: seerr
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: seerr-config-iscsi
            - name: backups
              persistentVolumeClaim:
                claimName: backups
