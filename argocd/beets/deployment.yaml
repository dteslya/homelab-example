apiVersion: apps/v1
kind: Deployment
metadata:
  name: beets
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: beets
  template:
    metadata:
      labels:
        app: beets
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: seed-config
          image: busybox@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: ["sh", "-c", "cp /source/config.yaml /config/config.yaml"]
          volumeMounts:
            - name: config-source
              mountPath: /source
            - name: config
              mountPath: /config
      containers:
        - name: beets
          # https://www.linuxserver.io/our-images
          image: lscr.io/linuxserver/beets:2.14.1-ls358
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Etc/UTC"
          ports:
            - name: webui
              containerPort: 8337
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media-library
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: beets-config-iscsi
        - name: config-source
          configMap:
            name: beets-config
        - name: media-library
          persistentVolumeClaim:
            claimName: media-library
