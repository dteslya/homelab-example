# Nightly copy of the beets library DB and import state (beets.tar.gz).
# config.yaml is left out: it comes from the ConfigMap.
# Writes the backups dataset (see README), always under the same filename:
# the B2 bucket keeps prior versions. Runs before the TrueNAS Cloud Sync push
# at 03:00.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: beets-backup
  namespace: media
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Gives up if Beets isn't running, so the pod can't sit Pending forever
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          # Same node as Beets: the config PVC is an RWO iSCSI volume, which
          # attaches to one node at a time
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: beets
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: backup
              image: keinos/sqlite3:3.54.1
              command:
                - sh
                - -c
                - |
                  set -e
                  mkdir -p /tmp/out
                  sqlite3 /config/musiclibrary.db ".backup /tmp/out/musiclibrary.db"
                  cp /config/state.pickle /tmp/out/
                  tar czf /backups/beets.tar.gz.tmp -C /tmp/out .
                  mv /backups/beets.tar.gz.tmp /backups/beets.tar.gz
              volumeMounts:
                - name: config
                  mountPath: /config
                - name: backups
                  mountPath: /backups
                  subPath: beets
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: beets-config-iscsi
            - name: backups
              persistentVolumeClaim:
                claimName: backups
