apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mail-relay
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:your-github-user/homelab.git
    targetRevision: HEAD
    path: argocd/mail-relay
  destination:
    server: https://kubernetes.default.svc
    namespace: mail
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
