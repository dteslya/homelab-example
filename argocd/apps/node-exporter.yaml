apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-exporter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-node-exporter
    targetRevision: 6.0.0
    helm:
      releaseName: node-exporter
      valuesObject:
        # Talos: only mount what's actually needed for host metrics (proc/sys/rootfs).
        # hostPath/hostPID need the privileged PSA tier on the monitoring namespace
        # (see monitoring-config).
        hostRootFsMount:
          enabled: true
        # Scraped by the node-exporter job in victoria-metrics.yaml, matched by Service name
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
