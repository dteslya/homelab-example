apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: photos-storage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: photos
  source:
    repoURL: "git@github.com:your-github-user/homelab.git"
    targetRevision: HEAD
    path: argocd/photos-storage
  destination:
    server: https://kubernetes.default.svc
    namespace: photos
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
