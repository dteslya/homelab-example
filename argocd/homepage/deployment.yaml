apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.8.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: homepage-secrets
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "homepage.lab.example.com"
          ports:
            - name: webui
              containerPort: 3000
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: settings
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
              readOnly: true
            - name: widgets
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
              readOnly: true
            - name: services
              mountPath: /app/config/services.yaml
              subPath: services.yaml
              readOnly: true
            - name: bookmarks
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          emptyDir: {}
        - name: settings
          configMap:
            name: homepage-config
        - name: widgets
          configMap:
            name: homepage-config
        - name: services
          configMap:
            name: homepage-config
        - name: bookmarks
          configMap:
            name: homepage-config
