apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - secret-oidc.yaml
  - securitypolicy.yaml
  - secret.yaml
# Generated with a content-hash name suffix, so any config change rolls the
# Deployment (subPath mounts never pick up ConfigMap updates in a running pod)
configMapGenerator:
  - name: homepage-config
    namespace: homepage
    files:
      - config/settings.yaml
      - config/widgets.yaml
      - config/services.yaml
      - config/bookmarks.yaml
