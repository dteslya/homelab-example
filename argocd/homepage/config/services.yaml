          url: http://bazarr.media.svc.cluster.local:6767
          key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"

- Calendar:
    - Releases:
        widget:
          type: calendar
          view: agenda
          maxEvents: 10
          showTime: true
          previousDays: 0
          # service_group/service_name reuse the Sonarr/Radarr widgets' url and key
          integrations:
            - type: sonarr
              service_group: Requests
              service_name: Sonarr
              color: teal
              params:
                unmonitored: false
            - type: radarr
              service_group: Requests
              service_name: Radarr
              color: amber
              params:
                unmonitored: false

