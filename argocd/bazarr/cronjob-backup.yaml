# Nightly copy of Bazarr's DB and config.yaml (bazarr.tar.gz).
# Writes the backups dataset (see README), always under the same filename:
# the B2 bucket keeps prior versions. Runs before the TrueNAS Cloud Sync push
# at 03:00.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bazarr-backup
  namespace: media
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Gives up if Bazarr isn't running, so the pod can't sit Pending forever
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          # Same node as Bazarr: the config PVC is an RWO iSCSI volume, which
          # attaches to one node at a time
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: bazarr
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: backup
              image: keinos/sqlite3:3.54.1
              command:
                - sh
                - -c
                - |
                  set -e
                  mkdir -p /tmp/out
                  mkdir -p /tmp/out/db /tmp/out/config
                  # .backup takes a consistent copy of the live WAL-mode DB
                  sqlite3 /config/db/bazarr.db ".backup /tmp/out/db/bazarr.db"
                  cp /config/config/config.yaml /tmp/out/config/
                  tar czf /backups/bazarr.tar.gz.tmp -C /tmp/out .
                  mv /backups/bazarr.tar.gz.tmp /backups/bazarr.tar.gz
              volumeMounts:
                - name: config
                  mountPath: /config
                - name: backups
                  mountPath: /backups
                  subPath: bazarr
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: bazarr-config-iscsi
            - name: backups
              persistentVolumeClaim:
                claimName: backups
