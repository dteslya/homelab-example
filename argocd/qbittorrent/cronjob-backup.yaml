# Nightly copy of qBittorrent's settings, categories, RSS and torrent resume
# data (BT_backup/), in qbittorrent.tar.gz.
# Writes the backups dataset (see README), always under the same filename:
# the B2 bucket keeps prior versions. Runs before the TrueNAS Cloud Sync push
# at 03:00.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qbittorrent-backup
  namespace: media
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Gives up if qBittorrent isn't running, so the pod can't sit Pending forever
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          # Same node as qBittorrent: the config PVC is RWO, and SQLite's WAL index
          # (-shm) is shared memory, which only works between processes on one
          # host (the NFS mount is also nolock, so locks are node-local)
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: qbittorrent
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: backup
              image: keinos/sqlite3:3.54.1
              command:
                - sh
                - -c
                - |
                  set -e
                  mkdir -p /tmp/out
                  mkdir -p /tmp/out/qBittorrent
                  cd /config/qBittorrent
                  cp -r qBittorrent.conf categories.json watched_folders.json rss BT_backup /tmp/out/qBittorrent/
                  tar czf /backups/qbittorrent.tar.gz.tmp -C /tmp/out .
                  mv /backups/qbittorrent.tar.gz.tmp /backups/qbittorrent.tar.gz
              volumeMounts:
                - name: config
                  mountPath: /config
                - name: backups
                  mountPath: /backups
                  subPath: qbittorrent
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: qbittorrent-config
            - name: backups
              persistentVolumeClaim:
                claimName: backups
