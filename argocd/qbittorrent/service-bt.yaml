apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-bt
  namespace: media
  annotations:
    metallb.io/loadBalancerIPs: "10.0.4.201"
spec:
  type: LoadBalancer
  selector:
    app: qbittorrent
  ports:
    - name: bt-tcp
      port: 6881
      targetPort: 6881
      protocol: TCP
    - name: bt-udp
      port: 6881
      targetPort: 6881
      protocol: UDP
