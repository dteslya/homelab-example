apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-gotenberg
  namespace: documents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-gotenberg
  template:
    metadata:
      labels:
        app: paperless-gotenberg
    spec:
      containers:
        - name: gotenberg
          # Same tag as Paperless's upstream docker-compose.postgres-tika.yml
          image: docker.io/gotenberg/gotenberg:9.9
          # Chromium renders .eml files; block JavaScript and any external
          # content such as tracking pixels (as upstream does)
          command:
            - gotenberg
            - --chromium-disable-javascript=true
            - --chromium-allow-list=^file:///tmp/.*
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              memory: 1Gi
