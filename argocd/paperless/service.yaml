apiVersion: v1
kind: Service
metadata:
  name: paperless
  namespace: documents
spec:
  selector:
    app: paperless
  ports:
    - name: webui
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-postgres
  namespace: documents
spec:
  selector:
    app: paperless-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-valkey
  namespace: documents
spec:
  selector:
    app: paperless-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-tika
  namespace: documents
spec:
  selector:
    app: paperless-tika
  ports:
    - name: http
      port: 9998
      targetPort: 9998
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-gotenberg
  namespace: documents
spec:
  selector:
    app: paperless-gotenberg
  ports:
    - name: http
      port: 3000
      targetPort: 3000
