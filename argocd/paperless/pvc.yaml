# Block storage (ext4 on iSCSI): Postgres gets a local filesystem with
# working fsync and locks. Sized for up to 1GB of WAL on top of the data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-postgres-iscsi
  namespace: documents
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-config
  resources:
    requests:
      storage: 2Gi
