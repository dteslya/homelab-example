apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-valkey
  namespace: documents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-valkey
  template:
    metadata:
      labels:
        app: paperless-valkey
    spec:
      containers:
        - name: valkey
          # Celery broker only, so no persistence: queued tasks are re-created
          # by the scheduler, and documents in flight are re-consumed.
          image: docker.io/valkey/valkey:9-alpine
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli ping | grep -q PONG"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
