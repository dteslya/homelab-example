# Example SealedSecret: the values below are placeholders, not ciphertext.
# Recreate it against your own cluster's sealed-secrets controller:
#
#   kubectl create secret generic paperless-oidc --namespace documents \
#     --from-literal=PAPERLESS_SOCIALACCOUNT_PROVIDERS='<value>' \
#     --dry-run=client -o yaml | kubeseal --format yaml > argocd/paperless/secret-oidc.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: paperless-oidc
  namespace: documents
spec:
  encryptedData:
    PAPERLESS_SOCIALACCOUNT_PROVIDERS: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: paperless-oidc
      namespace: documents
