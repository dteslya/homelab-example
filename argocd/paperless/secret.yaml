# Example SealedSecret: the values below are placeholders, not ciphertext.
# Recreate it against your own cluster's sealed-secrets controller:
#
#   kubectl create secret generic paperless-secrets --namespace documents \
#     --from-literal=PAPERLESS_ADMIN_PASSWORD='<value>' \
#     --from-literal=PAPERLESS_ADMIN_USER='<value>' \
#     --from-literal=PAPERLESS_DBPASS='<value>' \
#     --from-literal=PAPERLESS_SECRET_KEY='<value>' \
#     --dry-run=client -o yaml | kubeseal --format yaml > argocd/paperless/secret.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: paperless-secrets
  namespace: documents
spec:
  encryptedData:
    PAPERLESS_ADMIN_PASSWORD: REPLACE_WITH_KUBESEAL_OUTPUT
    PAPERLESS_ADMIN_USER: REPLACE_WITH_KUBESEAL_OUTPUT
    PAPERLESS_DBPASS: REPLACE_WITH_KUBESEAL_OUTPUT
    PAPERLESS_SECRET_KEY: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: paperless-secrets
      namespace: documents
