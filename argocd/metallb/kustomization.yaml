apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: metallb-system
helmCharts:
- name: metallb
  repo: https://metallb.github.io/metallb
  version: 0.16.2 # Pinning the chart version is highly recommended for stability
  releaseName: metallb-release
  # L2 only, no BGP: skip the frr-k8s backend (DaemonSet + webhook) that
  # 0.16 enables by default. The speaker falls back to native mode.
  valuesInline:
    frrk8s:
      enabled: false

resources:
  - config.yaml
  - namespace.yaml
