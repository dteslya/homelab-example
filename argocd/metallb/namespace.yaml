apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    # The speaker pod requires elevated permission in order to perform its network functionalities. https://metallb.universe.tf/installation/#installation-with-helm
    pod-security.kubernetes.io/enforce: privileged
    # Optional but good practice: Keep warning about baseline violations
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
