apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager # Ensure all resources are in the correct namespace
resources:
  - issuer-config.yaml
  - secrets.yaml

helmCharts:
  - name: cert-manager
    namespace: cert-manager # Ensure all resources are in the correct namespace
    repo: https://charts.jetstack.io
    version: v1.21.3
    releaseName: cert-manager
    valuesInline:
      installCRDs: true # Very important!
      global:
        leaderElection:
          namespace: "cert-manager"
