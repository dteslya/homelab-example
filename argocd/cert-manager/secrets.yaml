# Example SealedSecret: the values below are placeholders, not ciphertext.
# Recreate it against your own cluster's sealed-secrets controller:
#
#   kubectl create secret generic cloudflare-api-token --namespace cert-manager \
#     --from-literal=api-token='<value>' \
#     --dry-run=client -o yaml | kubeseal --format yaml > argocd/cert-manager/secrets.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  encryptedData:
    api-token: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: cloudflare-api-token
      namespace: cert-manager
