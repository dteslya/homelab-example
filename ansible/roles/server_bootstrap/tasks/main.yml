---
# Minimal images can ship without Python; raw works without it.
- name: Ensure python3 is installed
  ansible.builtin.raw: test -e /usr/bin/python3 || (apt-get update && apt-get install -y python3)
  register: server_bootstrap_python
  changed_when: server_bootstrap_python.stdout | length > 0

- name: Gather facts
  ansible.builtin.setup:

# The hash is only used when the user is created. An installer-made user
# (e.g. on the Incus host) already has a password and needs none.
- name: Check for the admin user
  ansible.builtin.getent:
    database: passwd
    key: "{{ server_admin_user }}"
    fail_key: false

- name: Assert server_admin_password_hash is set
  ansible.builtin.assert:
    that:
      - server_admin_password_hash is defined
      - server_admin_password_hash != "REPLACE_ME"
      - server_admin_password_hash is match('\$6\$')
    fail_msg: >-
      server_admin_password_hash is missing. Add a vault_*_admin_password_hash
      (from `openssl passwd -6`) to the host group's vault.yml with
      `ansible-vault edit`.
  when: ansible_facts.getent_passwd[server_admin_user] is none

- name: Upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist

- name: Install base packages
  ansible.builtin.apt:
    name:
      - sudo
      - ca-certificates
    state: present

- name: Create admin user
  ansible.builtin.user:
    name: "{{ server_admin_user }}"
    groups: sudo
    append: true
    shell: /bin/bash
    password: "{{ server_admin_password_hash | default(omit) }}"
    update_password: on_create

- name: Deploy admin authorized_keys
  ansible.builtin.include_role:
    name: server_hardening
    tasks_from: authorized_keys
