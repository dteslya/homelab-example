---
openwrt_ula_prefix: fd57:baea:7350::/48
openwrt_dhcp_default_duid: "0004b3571db36048405aa7fee3037701c2a0"

openwrt_bridge_ports: [lan1, lan2, wan]
openwrt_bridge_vlans:
  - { vid: 15, ports: [lan2:t, wan:t], ipv6: false }
  - { vid: 16, ports: [lan1:u*, lan2:t, wan:t] }
openwrt_vlan_interfaces:
  - { vid: 15, ipaddr: 10.0.15.11, gateway: "{{ openwrt_mgmt_gateway }}", dns: "{{ openwrt_dns_servers }}" }
  - { vid: 16 }

openwrt_leds:
  - { sysfs: yellow:status }
