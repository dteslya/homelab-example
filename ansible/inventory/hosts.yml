---
openwrt:
  vars:
    ansible_user: root
  children:
    gateway:
      hosts:
        gw:
          ansible_host: 10.0.15.1
    aps:
      hosts:
        ap1:
          ansible_host: 10.0.15.11
        ap2:
          ansible_host: 10.0.15.12
headscale:
  hosts:
    vps:
      ansible_host: 203.0.113.10
      ansible_user: admin
incus:
  hosts:
    ser8:
      ansible_host: 10.0.15.20
      ansible_user: admin
# No SSH or CLI: modules run on the controller and talk to the web UI (playbooks/backup.yml).
switches:
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  hosts:
    sw1:
      ansible_host: 10.0.15.4
# Debian/Ubuntu hosts covered by server_bootstrap.yml / server_hardening.yml.
servers:
  children:
    headscale:
    incus:
